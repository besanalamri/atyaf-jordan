<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <script>
      const path = window.location.pathname;
      const repo = "/atyaf-jordan";
      if (path.startsWith(repo) && path !== repo + "/") {
        const redirect = repo + "/?p=" + encodeURIComponent(path.slice(repo.length)) + window.location.search;
        window.location.replace(redirect);
      }
    </script>
  </head>
  <body></body>
</html>
